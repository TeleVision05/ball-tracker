# Install once per clone: pre-commit install
# Run on everything:      pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff pin in pyproject.toml ([project.optional-dependencies] dev).
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (balltrace/frontend)
        # Uses the oxlint pinned in balltrace/frontend/package.json; run `npm ci` there first.
        entry: npm --prefix balltrace/frontend run lint --
        language: system
        files: ^balltrace/frontend/.*\.(js|jsx|ts|tsx|mjs|cjs)$
        exclude: ^balltrace/frontend/(node_modules|dist)/
        pass_filenames: false
